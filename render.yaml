services:
  # Batchwise FastAPI Backend Service
  - type: web
    name: batchwise-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BATCHWISE_CORS_ORIGINS
        value: "*"
      - key: BATCHWISE_DATABASE_URL
        value: sqlite:///./batchwise.db

  # Batchwise React Frontend Static Site
  - type: web
    name: batchwise-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

